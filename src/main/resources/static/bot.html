<!DOCTYPE html>
<html>
<head>
    <title>StandUp AI Bot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>🤖 StandUp AI Chat Bot</h2>

<!-- Username input -->
<div>
    <label><strong>Username:</strong></label>
    <input type="text" id="usernameInput" placeholder="Enter your username" />
</div>

<!-- Team Name input -->
<div>
    <label><strong>Team Name:</strong></label>
    <input type="text" id="teamInput" placeholder="Enter your team name" />
</div>

<!-- Mood Dropdown -->
<div>
    <label><strong>Today's Mood:</strong></label>
    <select id="moodInput">
        <option value="😊 Productive">😊 Productive</option>
        <option value="🎯 Focused">🎯 Focused</option>
        <option value="🚀 Motivated">🚀 Motivated</option>
        <option value="💪 Challenged">💪 Challenged</option>
        <option value="😴 Tired">😴 Tired</option>
    </select>
</div>
<br/>

<!-- Chat box -->
<div id="messages" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px;"></div>

<!-- Input message -->
<textarea id="messageInput" rows="4" cols="60" placeholder="Type your message or standup..."></textarea><br/>
<button onclick="sendMessage()">Send</button>

<script>
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);
        stompClient.subscribe('/topic/messages', function (message) {
            showMessage(JSON.parse(message.body));
        });
    });

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const username = document.getElementById('usernameInput').value.trim();
        const mood = document.getElementById('moodInput').value;
        const team = document.getElementById('teamInput').value.trim();
        const messageText = input.value.trim();

        if (!username || !messageText || !team) {
            alert('Please enter username, team, and message.');
            return;
        }

        const message = {
            text: messageText,
            from: username,
            mood: mood,
            team: team
        };

        stompClient.send("/app/chat", {}, JSON.stringify(message));
        input.value = '';
    }

    function showMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.innerHTML = `<strong>${message.from}:</strong> ${message.text} <small>${message.timestamp}</small>`;
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
